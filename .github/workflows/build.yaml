name: Build and publish image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - .github/workflows/build.yaml
  workflow_dispatch:
    schedule:
      - cron: '3 3 * * 6'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/texlive-ubuntu:latest
            ghcr.io/${{ github.repository_owner }}/texlive-ubuntu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
